# Publishes site/ to GitHub Pages, free, at https://jackwwinstanley.github.io/fortres/
name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the 404 page uses root paths. The site lives under /fortres/ here and at / on a server of its own.
      - name: Point the 404 page at the /fortres/ subpath
        run: sed -i 's#="/#="/fortres/#g' site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
